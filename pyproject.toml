[project]
name = "football-injuries"
version = "0.1.0"
description = "Big Five leagues: playing style x injuries (2014/15-2025/26). Data collection (scraper/) and analysis (analysis/)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    # Pinned: collect/transfermarkt.py uses the SDK's low-level client (Transfermarkt._client).
    "transfermarkt-api==5.0.0",
]

[tool.uv]
package = false

[dependency-groups]
analysis = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]
